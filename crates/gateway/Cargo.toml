[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
proto = { path = "../proto" }
coordinator = { path = "../coordinator" }
storage-engine = { path = "../storage-engine" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "timeout"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures-util = "0.3"
http = "1"
mime = "0.3"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
tonic = "0.11"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"

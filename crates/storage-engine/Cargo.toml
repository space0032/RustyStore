[package]
name = "storage-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
thiserror = "2"
hex = "0.4"
async-trait = "0.1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }

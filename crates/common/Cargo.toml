[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
envy = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid"] }

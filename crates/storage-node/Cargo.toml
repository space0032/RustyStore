[package]
name = "storage-node"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
storage-engine = { path = "../storage-engine" }
metadata = { path = "../metadata" }
proto = { path = "../proto" }
observability = { path = "../observability" }
tonic = "0.11"
axum = "0.7"
futures-util = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["full", "sync"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }

[package]
name = "coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
metadata = { path = "../metadata" }
proto = { path = "../proto" }
observability = { path = "../observability" }
axum = "0.7"
tonic = "0.11"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
chrono = "0.4"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

[package]
name = "rustystore_integration_tests"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../crates/common" }
coordinator = { path = "../crates/coordinator" }
metadata = { path = "../crates/metadata" }
storage-engine = { path = "../crates/storage-engine" }
storage-node = { path = "../crates/storage-node" }
gateway = { path = "../crates/gateway" }
proto = { path = "../crates/proto" }
tonic = "0.11"
sha2 = "0.10"
chrono = "0.4"
hex = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full", "macros"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
serde_json = "1"
async-stream = "0.3"
futures-util = "0.3"

[dev-dependencies]

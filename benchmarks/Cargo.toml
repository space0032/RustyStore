[package]
name = "rustystore_benchmarks"
version = "0.1.0"
edition = "2024"

[dependencies]
criterion = "0.5"
rand = "0.8"
sha2 = "0.10"
tempfile = "3"
storage-engine = { path = "../crates/storage-engine" }

[[bench]]
name = "chunk_hashing"
harness = false

[[bench]]
name = "storage_throughput"
harness = false

[profile.release]
opt-level = 3

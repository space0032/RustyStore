[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/common",
  "crates/storage-engine",
  "crates/metadata",
  "crates/coordinator",
  "crates/storage-node",
  "crates/gateway",
  "crates/observability",
  "benchmarks",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
